<title>i12farm Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one phone-sized app column; full-bleed map under floating search, a Bolt-style bottom sheet, fixed bottom nav. */
:root {
  --bg: #F3FBF6; --surface: #FFFFFF; --surface-2: #E8F5ED; --ink: #053B2B; --ink-2: #4A5F55;
  --line: #D3E6DA; --sprout: #12B76A; --sprout-deep: #067647; --on-primary: #FFFFFF;
  --lime: #B6F04A; --on-lime: #053B2B; --amber: #F5A524; --amber-tint: #FDF0D6;
  --water: #B8DCE4; --land: #EEF8F1; --land-out: #DDE9E1; --map-border: #8DB8A0; --map-label: #2F4A3E; --map-grid: rgba(5,59,43,.06);
  --pin: #067647; --pin-icon: #FFFFFF; --cluster-bg: #053B2B; --cluster-fg: #FFFFFF; --halo: rgba(255,255,255,.85);
  --shadow: 0 8px 28px rgba(5,59,43,.14); --shadow-sm: 0 2px 8px rgba(5,59,43,.10);
  --font: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r-lg: 22px; --r-md: 14px; --tap: 48px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #06140F; --surface: #0D231B; --surface-2: #133026; --ink: #E4F4EA; --ink-2: #A3BDB0;
  --line: #21402F; --sprout: #2BD884; --sprout-deep: #12B76A; --on-primary: #04281D;
  --lime: #C4F56A; --on-lime: #06140F; --amber: #F7B347; --amber-tint: #3A2C0F;
  --water: #123A47; --land: #10291F; --land-out: #0A1A14; --map-border: #2E6A4E; --map-label: #B3CFC0; --map-grid: rgba(228,244,234,.05);
  --pin: #2BD884; --pin-icon: #04281D; --cluster-bg: #E4F4EA; --cluster-fg: #06140F; --halo: rgba(6,20,15,.85);
  --shadow: 0 8px 28px rgba(0,0,0,.45); --shadow-sm: 0 2px 8px rgba(0,0,0,.35); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #06140F; --surface: #0D231B; --surface-2: #133026; --ink: #E4F4EA; --ink-2: #A3BDB0;
  --line: #21402F; --sprout: #2BD884; --sprout-deep: #12B76A; --on-primary: #04281D;
  --lime: #C4F56A; --on-lime: #06140F; --amber: #F7B347; --amber-tint: #3A2C0F;
  --water: #123A47; --land: #10291F; --land-out: #0A1A14; --map-border: #2E6A4E; --map-label: #B3CFC0; --map-grid: rgba(228,244,234,.05);
  --pin: #2BD884; --pin-icon: #04281D; --cluster-bg: #E4F4EA; --cluster-fg: #06140F; --halo: rgba(6,20,15,.85);
  --shadow: 0 8px 28px rgba(0,0,0,.45); --shadow-sm: 0 2px 8px rgba(0,0,0,.35); color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; overflow: hidden; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sprout); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.2; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { position: relative; height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }
@media (min-width: 520px) { #app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); box-shadow: var(--shadow); } }

/* Top bar */
.topbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); z-index: 20; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 19px; letter-spacing: -.01em; margin-right: auto; }
.brand b { color: var(--sprout-deep); font-weight: 800; }
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13px; white-space: nowrap; }
.pill svg { width: 16px; height: 16px; }
.role-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sprout); }

/* Screens */
.screens { position: relative; flex: 1; min-height: 0; }
.screen { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.screen.pad { padding: 20px 16px 28px; display: flex; flex-direction: column; gap: 16px; }

/* Explore */
#explore { overflow: hidden; }
.map-canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; cursor: grab; }
.map-canvas:active { cursor: grabbing; }
.map-top { position: absolute; top: 12px; left: 16px; right: 16px; display: flex; flex-direction: column; gap: 10px; z-index: 5; pointer-events: none; }
.map-top > * { pointer-events: auto; }
.search { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 8px 0 16px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line); }
.search svg { width: 20px; height: 20px; color: var(--ink-2); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 15px; height: 48px; }
.search input::placeholder { color: var(--ink-2); }
.search select { border: 0; background: var(--surface-2); border-radius: 999px; height: 36px; padding: 0 10px; font-weight: 600; font-size: 13px; max-width: 40%; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 4px; margin: 0 -16px; padding-inline: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13px; box-shadow: var(--shadow-sm); white-space: nowrap; }
.chip svg { width: 16px; height: 16px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.map-ctrl { position: absolute; right: 16px; z-index: 5; display: flex; flex-direction: column; gap: 8px; transition: bottom .25s ease; }
.ctrl { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-sm); display: grid; place-items: center; }
.ctrl svg { width: 20px; height: 20px; }
.map-attr { position: absolute; left: 16px; z-index: 4; font-size: 11px; color: var(--ink-2); background: var(--halo); padding: 2px 8px; border-radius: 6px; transition: bottom .25s ease; }

.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-radius: var(--r-lg) var(--r-lg) 0 0; box-shadow: 0 -6px 24px rgba(5,59,43,.12); display: flex; flex-direction: column; transition: height .28s cubic-bezier(.2,.8,.2,1); height: 214px; border-top: 1px solid var(--line); }
.sheet.open { height: calc(100% - 64px); }
.sheet-head { display: flex; align-items: center; gap: 12px; padding: 8px 16px 6px; border: 0; background: none; width: 100%; text-align: left; flex-direction: column; }
.grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); }
.sheet-title { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px; }
.sheet-title h2 { font-size: 16px; font-weight: 700; }
.sheet-title span { font-size: 13px; color: var(--sprout-deep); font-weight: 700; }
.carousel { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 16px 14px; scrollbar-width: none; }
.carousel::-webkit-scrollbar { display: none; }
.sheet.open .carousel { display: none; }
.sheet-list { display: none; overflow-y: auto; padding: 4px 16px 24px; flex-direction: column; gap: 14px; }
.sheet.open .sheet-list { display: flex; }
.empty-note { padding: 8px 16px 16px; color: var(--ink-2); font-size: 14px; }

.fcard { flex: none; width: 78%; max-width: 320px; scroll-snap-align: start; display: flex; gap: 12px; padding: 10px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); text-align: left; align-items: stretch; }
.fcard.sel { border-color: var(--sprout); box-shadow: 0 0 0 2px var(--sprout) inset; }
.fcard .thumb { width: 92px; flex: none; border-radius: 10px; overflow: hidden; aspect-ratio: 1; max-width: 100%; }
.h3 { display: block; }
.fcard .body { min-width: 0; display: flex; flex-direction: column; gap: 3px; justify-content: center; }
.fcard .h3 { font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta { font-size: 13px; color: var(--ink-2); }
.price { font-weight: 700; font-size: 14px; }
.price small { font-weight: 500; color: var(--ink-2); font-size: 12px; }
.lcard { display: flex; flex-direction: column; gap: 10px; border: 0; background: none; padding: 0; text-align: left; width: 100%; }
.lcard .thumb { width: 100%; aspect-ratio: 16/10; border-radius: var(--r-md); overflow: hidden; position: relative; max-width: 100%; }
.lcard .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.lcard .h3 { font-size: 16px; font-weight: 700; }
.cover { width: 100%; height: 100%; display: block; }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--on-lime); background: var(--lime); padding: 2px 8px; border-radius: 999px; }
.badge svg { width: 12px; height: 12px; }
.badge.soft { background: var(--surface-2); color: var(--ink); }
.thumb .badge { position: absolute; left: 10px; top: 10px; }
.heart { position: absolute; right: 10px; top: 10px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--halo); display: grid; place-items: center; }
.heart svg { width: 20px; height: 20px; }
.heart[aria-pressed="true"] svg { fill: var(--amber); stroke: var(--amber); }

/* Bottom nav */
.nav { display: flex; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 20; }
.nav button { flex: 1; min-height: 62px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 700; color: var(--ink-2); }
.nav button span.ic { padding: 3px 16px; border-radius: 999px; display: grid; place-items: center; }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--sprout-deep); }
.nav button[aria-current="page"] span.ic { background: color-mix(in srgb, var(--sprout) 18%, transparent); }

/* Overlays (farm page, wizard) */
.overlay { position: absolute; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; animation: slide .24s cubic-bezier(.2,.8,.2,1); }
@keyframes slide { from { transform: translateY(24px); opacity: .4; } to { transform: none; opacity: 1; } }
.ov-scroll { flex: 1; overflow-y: auto; min-height: 0; }
.ov-bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.ov-bar h2 { font-size: 17px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 20px; height: 20px; }
.hero { position: relative; aspect-ratio: 16/11; max-height: 300px; width: 100%; max-width: 100%; }
.hero .float { position: absolute; top: 12px; display: flex; gap: 8px; }
.hero .float.l { left: 16px; } .hero .float.r { right: 16px; }
.hero .icon-btn { background: var(--halo); border: 0; }
.hero .icon-btn[aria-pressed="true"] svg { fill: var(--amber); stroke: var(--amber); }
.photo-dots { position: absolute; bottom: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; }
.photo-dots button { width: 8px; height: 8px; border-radius: 50%; border: 0; padding: 0; background: var(--halo); }
.photo-dots button[aria-current="true"] { background: var(--lime); width: 20px; border-radius: 4px; }
.farm-body { padding: 18px 16px 120px; display: flex; flex-direction: column; gap: 22px; }
.farm-head { display: flex; flex-direction: column; gap: 8px; }
.farm-head h1 { font-size: 26px; font-weight: 800; letter-spacing: -.015em; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); }
.tag svg { width: 14px; height: 14px; color: var(--sprout-deep); }
.section { display: flex; flex-direction: column; gap: 12px; }
.section h2 { font-size: 18px; font-weight: 700; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; min-width: 0; }
.fact dt { font-size: 12px; color: var(--ink-2); }
.fact dd { margin: 2px 0 0; font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; }
.offer { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
.offer .l { min-width: 0; display: flex; gap: 12px; align-items: center; }
.offer .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; flex: none; color: var(--sprout-deep); }
.offer .ic svg { width: 22px; height: 22px; }
.offer h3 { font-size: 15px; font-weight: 700; }
.offer .r { text-align: right; flex: none; }
.mini-map { position: relative; height: 180px; border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--line); max-width: 100%; }
.mini-map canvas { pointer-events: none; }
.loc-note { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--ink-2); }
.loc-note svg { width: 16px; height: 16px; flex: none; margin-top: 2px; color: var(--sprout-deep); }
.actionbar { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; z-index: 2; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 18px; border-radius: 999px; font-weight: 700; font-size: 15px; border: 1px solid transparent; }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--sprout-deep); color: var(--on-primary); }
.btn.secondary { background: var(--surface); border-color: var(--line); }
.btn.lime { background: var(--lime); color: var(--on-lime); }
.btn.ghost { background: none; color: var(--sprout-deep); padding: 0 8px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* Cards and dashboards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.card h2 { font-size: 18px; font-weight: 700; }
.card.ink { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.card.ink .meta { color: color-mix(in srgb, var(--bg) 75%, transparent); }
.page-title { font-size: 26px; font-weight: 800; letter-spacing: -.015em; }
.lead { color: var(--ink-2); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { border-radius: var(--r-md); background: var(--surface-2); padding: 12px; min-width: 0; }
.stat b { display: block; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--ink-2); }
.progress { height: 12px; border-radius: 999px; background: color-mix(in srgb, var(--bg) 22%, transparent); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--lime); border-radius: 999px; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 84px 1fr 28px; gap: 10px; align-items: center; font-size: 14px; }
.bar-row .track { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar-row .track i { display: block; height: 100%; background: var(--sprout); border-radius: 999px; }
.bar-row b { text-align: right; font-variant-numeric: tabular-nums; }
.rows { display: flex; flex-direction: column; }
.rowi { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; }
.rowi:first-child { border-top: 0; }
.rowi .thumb { width: 48px; height: 48px; border-radius: 12px; overflow: hidden; flex: none; }
.rowi .grow { min-width: 0; flex: 1; }
.rowi .h3 { font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log { font-family: var(--mono); font-size: 12px; line-height: 1.55; background: var(--surface-2); border-radius: var(--r-md); padding: 12px; overflow-x: auto; max-height: 260px; overflow-y: auto; }
.log div { white-space: nowrap; }
.log time { color: var(--ink-2); }
.log b { color: var(--sprout-deep); font-weight: 500; }
.edit-row { display: grid; grid-template-columns: minmax(0, 1fr) 110px auto; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.edit-row:first-of-type { border-top: 0; }
.edit-row .t { min-width: 0; }
.edit-row .t h3 { font-size: 14px; font-weight: 700; }
.hist { font-size: 12px; color: var(--ink-2); grid-column: 1 / -1; font-variant-numeric: tabular-nums; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lbl { font-size: 14px; font-weight: 700; }
.field .hint { font-size: 13px; color: var(--ink-2); }
.input { min-height: var(--tap); border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px; font-size: 16px; width: 100%; }
textarea.input { padding: 12px 14px; min-height: 92px; resize: vertical; }
.input:focus { outline: none; border-color: var(--sprout); box-shadow: 0 0 0 3px color-mix(in srgb, var(--sprout) 25%, transparent); }
.check { display: flex; gap: 10px; align-items: center; font-size: 14px; min-height: 40px; }
.check input { width: 20px; height: 20px; accent-color: var(--sprout-deep); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.cat-opt { display: flex; gap: 10px; align-items: center; min-height: 54px; padding: 0 12px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; text-align: left; }
.cat-opt svg { width: 22px; height: 22px; color: var(--sprout-deep); flex: none; }
.cat-opt[aria-pressed="true"] { border-color: var(--sprout-deep); background: color-mix(in srgb, var(--sprout) 14%, var(--surface)); box-shadow: 0 0 0 1px var(--sprout-deep) inset; }
.vis-opt { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); }
.vis-opt input { margin-top: 3px; width: 20px; height: 20px; accent-color: var(--sprout-deep); flex: none; }
.vis-opt b { display: block; font-size: 14px; }
.vis-opt span { font-size: 13px; color: var(--ink-2); }
.vis-opt:has(input:checked) { border-color: var(--sprout-deep); }
.pick-map { position: relative; height: 260px; border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--line); max-width: 100%; }
.center-pin { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -100%); pointer-events: none; width: 40px; height: 52px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.25)); }
.center-pin::after { content: ''; position: absolute; left: 50%; bottom: -4px; width: 10px; height: 4px; margin-left: -5px; border-radius: 50%; background: rgba(0,0,0,.25); }
.coords { position: absolute; left: 10px; bottom: 10px; font-family: var(--mono); font-size: 11px; background: var(--halo); padding: 2px 8px; border-radius: 6px; }
.photos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.photos figure { margin: 0; position: relative; aspect-ratio: 1; border-radius: var(--r-md); overflow: hidden; background: var(--surface-2); max-width: 100%; }
.photos img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photos figcaption { position: absolute; left: 6px; bottom: 6px; font-size: 11px; font-family: var(--mono); background: var(--halo); padding: 1px 6px; border-radius: 5px; }
.photos .x { position: absolute; right: 6px; top: 6px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--halo); display: grid; place-items: center; }
.photos .x svg { width: 16px; height: 16px; }
.upload { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border: 2px dashed var(--line); border-radius: var(--r-md); min-height: 120px; text-align: center; padding: 16px; font-weight: 700; color: var(--sprout-deep); }
.upload svg { width: 28px; height: 28px; }
.prod-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 12px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); }
.prod-row .grid2 { grid-column: 1 / -1; }
.steps { display: flex; gap: 6px; }
.steps i { flex: 1; height: 4px; border-radius: 3px; background: var(--line); }

.wiz-body { padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 16px; }
.wiz-body h1 { font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
.wiz-foot { padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); display: flex; gap: 10px; }
.wiz-foot .btn.primary { flex: 1; }
.error { color: var(--ink); background: var(--amber-tint); border-radius: 10px; padding: 10px 12px; font-size: 14px; font-weight: 600; }
.review { display: flex; flex-direction: column; gap: 0; }
.review div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.review div:first-child { border-top: 0; }
.review dt { color: var(--ink-2); }
.review dd { margin: 0; font-weight: 700; text-align: right; min-width: 0; }

/* Sheets and toast */
.scrim { position: absolute; inset: 0; z-index: 40; background: rgba(3,20,14,.45); display: flex; align-items: flex-end; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal { width: 100%; background: var(--surface); border-radius: var(--r-lg) var(--r-lg) 0 0; padding: 10px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; max-height: 88%; overflow-y: auto; animation: slide .22s ease; }
.modal .grip { align-self: center; }
.modal h2 { font-size: 20px; font-weight: 800; }
.role-opt { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); text-align: left; width: 100%; }
.role-opt[aria-pressed="true"] { border-color: var(--sprout-deep); box-shadow: 0 0 0 1px var(--sprout-deep) inset; }
.role-opt .ic { width: 42px; height: 42px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; color: var(--sprout-deep); flex: none; }
.role-opt .ic svg { width: 22px; height: 22px; }
.role-opt b { display: block; }
.role-opt span { font-size: 13px; color: var(--ink-2); }
.phone-box { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px; border-radius: var(--r-md); background: var(--surface-2); }
.phone-box output { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; user-select: all; }
.demo-tag { font-size: 12px; color: var(--ink-2); }
.toast { position: absolute; left: 16px; right: 16px; bottom: 78px; z-index: 50; background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: center; animation: slide .2s ease; }
.toast svg { width: 18px; height: 18px; flex: none; color: var(--lime); }
.banner { font-size: 12px; color: var(--ink-2); background: var(--surface-2); padding: 6px 16px; text-align: center; border-bottom: 1px solid var(--line); }

const DAY = 864e5;
function seedFarms() {
  const now = Date.now();
  return SEED.map((r, i) => {
    const [name, farmer, cats, county, sub, place, lng, lat, vis, verified, listings, size, since, desc] = r;
    const id = 'f' + (i + 1);
    return {
      id, name, farmer, cats, county, sub, place, lng, lat, vis, verified: !!verified, size, since, desc,
      phone: '0700 ' + String(100 + i * 3).padStart(3, '0') + ' ' + String(400 + ((i * 37) % 600)).padStart(3, '0'),
      owner: i === 0 ? 'farmer' : null, agent: i === 0 ? null : 'agent', photos: [],
      createdAt: now - ((i * 5) % 29 + 1) * DAY - i * 3600e3,
      stats: { views: 24 + ((i * 37) % 140), call: (i * 7) % 9, whatsapp: (i * 11) % 13 },
      listings: listings.map(([p, price, qty], j) => ({ id: id + 'l' + j, product: p, price, qty, unit: PROD[p].unit })),
    };
  });
}

}

}

}

class FarmMap {
  constructor(canvas, opts = {}) {
    this.cv = canvas; this.ctx = canvas.getContext('2d');
    this.lng = opts.lng ?? 36; this.lat = opts.lat ?? -0.6; this.z = opts.z ?? 6.2;
    this.interactive = opts.interactive !== false; this.onTap = opts.onTap; this.onMove = opts.onMove;
    this.points = []; this.selected = null; this.clusters = []; this.minZ = 5.2; this.maxZ = 15;
    this.pointers = new Map(); this.raf = 0; this.anim = null;
    this.ro = new ResizeObserver(() => this.resize()); this.ro.observe(canvas.parentElement);
    if (this.interactive) this.bind();
    this.resize();
  }
  destroy() { this.ro.disconnect(); cancelAnimationFrame(this.raf); this.dead = true; }
  resize() {
    const r = this.cv.parentElement.getBoundingClientRect();
    this.W = Math.max(1, r.width); this.H = Math.max(1, r.height); this.dpr = Math.min(2.5, window.devicePixelRatio || 1);
    this.cv.width = Math.round(this.W * this.dpr); this.cv.height = Math.round(this.H * this.dpr);
    this.draw();
  }
  scale() { return 256 * Math.pow(2, this.z); }
  world(lng, lat, s = this.scale()) {
    const sin = Math.sin(lat * Math.PI / 180);
    return [(lng + 180) / 360 * s, (0.5 - Math.log((1 + sin) / (1 - sin)) / (4 * Math.PI)) * s];
  }
  unworld(x, y, s = this.scale()) {
    const lng = x / s * 360 - 180;
    const n = Math.PI - 2 * Math.PI * y / s;
    return [lng, 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)))];
  }
  toScreen(lng, lat) { const s = this.scale(); const [x, y] = this.world(lng, lat, s); const [cx, cy] = this.world(this.lng, this.lat, s); return [x - cx + this.W / 2, y - cy + this.H / 2]; }
  fromScreen(px, py) { const s = this.scale(); const [cx, cy] = this.world(this.lng, this.lat, s); return this.unworld(cx + px - this.W / 2, cy + py - this.H / 2, s); }
  bounds() { const [w, n] = this.fromScreen(0, 0); const [e, s] = this.fromScreen(this.W, this.H); return { w, e, n, s }; }
  zoomAt(nz, px, py) {
    nz = Math.max(this.minZ, Math.min(this.maxZ, nz));
    const [alng, alat] = this.fromScreen(px, py); this.z = nz;
    const s = this.scale(); const [ax, ay] = this.world(alng, alat, s);
    [this.lng, this.lat] = this.unworld(ax - (px - this.W / 2), ay - (py - this.H / 2), s);
    this.changed();
  }

}

function compress(file) {

    const img = new Image(); const url = URL.createObjectURL(file);

  return `<button class="rowi" type="button" data-open="${f.id}"><span class="thumb">${coverSVG(f)}</span><span class="grow"><span class="h3">${esc(f.name)}</span><span class="meta">${sub ?? esc(f.place + ' · ' + COUNTIES[f.county].name)}</span></span>${f.verified ? `<span class="badge">${svg('check')}</span>` : ''}</button>`;
}
function ago(ts) { const d = Math.floor((Date.now() - ts) / DAY); return d <= 0 ? t('today') : t('daysAgo', { n: d }); }
function renderMe() {
  const me = $('#me');
  if (S.role === 'buyer') {
    const saved = S.saved.map(farmById).filter(Boolean), cont = S.contacted.map(farmById).filter(Boolean);
    me.innerHTML = `<h1 class="page-title">${esc(t('savedTitle'))}</h1>
      <div class="card">${saved.length ? `<div class="rows">${saved.map(f => farmRow(f)).join('')}</div>` : `<p class="lead">${esc(t('savedEmpty'))}</p>`}</div>
      <div class="card"><h2>${esc(t('contactedTitle'))}</h2>${cont.length ? `<div class="rows">${cont.map(f => farmRow(f)).join('')}</div>` : `<p class="lead">${esc(t('contactedEmpty'))}</p>`}</div>
      <div class="card ink"><h2>${esc(t('haveFarm'))}</h2><p class="meta">${esc(t('haveFarmD'))}</p><button class="btn lime" type="button" data-role="farmer">${svg('sprout')}${esc(t('switchFarmer'))}</button></div>`;
    return;
  }
  if (S.role === 'farmer') {
    const mine = S.farms.filter(f => f.owner === 'farmer');
    me.innerHTML = `<h1 class="page-title">${esc(t('myFarms'))}</h1>
      ${mine.map(f => `<div class="card">
        <div style="display:flex;gap:12px;align-items:center"><span style="width:64px;height:64px;border-radius:14px;overflow:hidden;flex:none">${coverSVG(f)}</span>
          <div style="min-width:0;flex:1"><h2>${esc(f.name)}</h2><p class="meta">${esc(f.place)} · ${esc(COUNTIES[f.county].name)}</p></div></div>
        <div class="stats"><div class="stat"><b>${f.stats.views}</b><span>${esc(t('views'))}</span></div><div class="stat"><b>${f.stats.call || 0}</b><span>${esc(t('calls'))}</span></div><div class="stat"><b>${f.stats.whatsapp || 0}</b><span>${esc(t('was'))}</span></div></div>
        <h2 style="font-size:16px">${esc(t('products'))}</h2>
        <div>${f.listings.map(l => {
          const hist = S.priceHistory.filter(h => h.listing === l.id).slice(-4);
          return `<div class="edit-row"><div class="t"><h3>${esc(prodName(l.product))}</h3><span class="meta">${esc(t('per', { u: unitName(l.unit) }))}</span></div>
            <label class="sr" for="pe-${l.id}">${esc(t('price'))}</label><input class="input num" id="pe-${l.id}" inputmode="numeric" value="${l.price ?? ''}" style="min-height:42px">
            <button class="btn secondary" type="button" data-saveprice="${f.id}|${l.id}" style="min-height:42px;padding:0 14px">${esc(t('savePrice'))}</button>
            ${hist.length > 1 ? `<div class="hist">${esc(t('history'))}: ${hist.map(h => kes(h.price)).join(' → ')}</div>` : ''}</div>`;
        }).join('')}</div>
        <button class="btn secondary block" type="button" data-open="${f.id}">${esc(t('viewPublic'))}</button>
      </div>`).join('')}
      <div class="card ink"><h2>${esc(t('pinCta'))}</h2><p class="meta">${esc(t('pinCtaD'))}</p><button class="btn lime" type="button" data-wizard>${svg('plus')}${esc(t('addFarm'))}</button></div>`;
    return;
  }
  // agent
  const enrolled = S.farms.filter(f => f.agent === 'agent');
  const n = enrolled.length, pct = Math.min(100, n);
  const byC = PILOT_ORDER.map(c => [c, enrolled.filter(f => f.county === c).length]);
  const maxC = Math.max(1, ...byC.map(x => x[1]));
  const contacts = S.events.filter(e => e.name === 'contact.tapped');
  const demand = {}; contacts.forEach(e => { if (e.props.product) demand[e.props.product] = (demand[e.props.product] || 0) + 1; });
  const top = Object.entries(demand).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const recent = enrolled.slice().sort((a, b) => b.createdAt - a.createdAt).slice(0, 6);
  const log = S.events.slice(-14).reverse();
  me.innerHTML = `<h1 class="page-title">${esc(t('role_agent'))}</h1>
    <div class="card ink"><span class="meta">${esc(t('pilot'))}</span><h2 class="num" style="font-size:22px">${esc(t('target', { n }))}</h2>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${n}"><i style="width:${pct}%"></i></div>
      <button class="btn lime" type="button" data-wizard>${svg('plus')}${esc(t('enrolCta'))}</button></div>
    <div class="card"><h2>${esc(t('byCounty'))}</h2><div class="bars">${byC.map(([c, k]) => `<div class="bar-row"><span>${esc(COUNTIES[c].name)}</span><span class="track"><i style="width:${k / maxC * 100}%"></i></span><b>${k}</b></div>`).join('')}</div></div>
    <div class="card"><h2>${esc(t('recentEnrol'))}</h2><div class="rows">${recent.map(f => farmRow(f, esc(COUNTIES[f.county].name + ' · ' + t('enrolledOn', { d: ago(f.createdAt) })))).join('')}</div></div>
    <div class="card"><h2>${esc(t('dataTitle'))}</h2><p class="lead">${esc(t('dataD'))}</p>
      <div class="stats"><div class="stat"><b>${S.events.length}</b><span>${esc(t('events'))}</span></div><div class="stat"><b>${contacts.length}</b><span>${esc(t('contacts'))}</span></div><div class="stat"><b>${S.priceHistory.length}</b><span>${esc(t('priceRecs'))}</span></div></div>
      <h2 style="font-size:16px">${esc(t('demand'))}</h2>
      ${top.length ? `<div class="bars">${top.map(([p, k]) => `<div class="bar-row" style="grid-template-columns:minmax(0,1fr) 90px 28px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(prodName(p))}</span><span class="track"><i style="width:${k / top[0][1] * 100}%"></i></span><b>${k}</b></div>`).join('')}</div>` : `<p class="meta">${esc(t('noDemand'))}</p>`}
      <div class="log" aria-label="Event log">${log.length ? log.map(e => `<div><time>${new Date(e.at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</time> <b>${esc(e.name)}</b> ${esc(Object.entries(e.props).filter(([k]) => k !== 'county').map(([k, v]) => k + '=' + v).join(' '))}${e.county ? ' county=' + e.county : ''}</div>`).join('') : '<div>–</div>'}</div>
      <button class="btn secondary block" type="button" data-csv>${svg('clipboard')}${esc(t('copyCsv'))}</button></div>`;
}

/* ===================== Global events ===================== */
document.addEventListener('click', e => {
  const o = e.target.closest('[data-open]'); if (o) { e.preventDefault(); openFarm(o.dataset.open); return; }
  const s = e.target.closest('[data-save]'); if (s) { e.preventDefault(); toggleSave(s.dataset.save); return; }
  const nav = e.target.closest('.nav [data-tab]'); if (nav) { closeOverlay(true); setTab(nav.dataset.tab); return; }
  if (e.target.closest('[data-wizard]')) { openWizard(); return; }
  const r = e.target.closest('[data-role]'); if (r && !r.classList.contains('role-opt')) { setRole(r.dataset.role); return; }
  const sp = e.target.closest('[data-saveprice]');
  if (sp) {
    const [fid, lid] = sp.dataset.saveprice.split('|'); const f = farmById(fid); const l = f.listings.find(x => x.id === lid);
    const v = Math.round(+document.getElementById('pe-' + lid).value);
    if (v > 0 && v !== l.price) { l.price = v; S.priceHistory.push({ at: Date.now(), farm: fid, listing: lid, product: l.product, county: f.county, price: v }); track('listing.price_changed', { farm: fid, product: l.product, price: v, county: f.county }); persist(); renderMe(); toast(t('priceSaved')); }
    return;
  }
  if (e.target.closest('[data-csv]')) {
    const rows = [['time', 'event', 'role', 'county', 'properties'], ...S.events.map(ev => [new Date(ev.at).toISOString(), ev.name, ev.role, ev.county ?? '', JSON.stringify(ev.props).replace(/"/g, '""')])];
    const csv = rows.map(r => r.map((c, i) => i === 4 ? `"${c}"` : c).join(',')).join('\n');
    navigator.clipboard?.writeText(csv).then(() => toast(t('copiedCsv', { n: S.events.length })), () => toast('CSV: ' + S.events.length));
  }
});
function setRole(role) { S.role = role; persist(); track('demo.role_changed', { role }); renderChrome(); if (tab === 'me') renderMe(); }
$('#roleBtn').onclick = () => {
  const m = modal(`<h2>${esc(t('viewingAs'))}</h2>${['buyer', 'farmer', 'agent'].map(r => `<button class="role-opt" type="button" data-role="${r}" aria-pressed="${S.role === r}"><span class="ic">${svg(r === 'buyer' ? 'search' : r === 'farmer' ? 'sprout' : 'badge')}</span><span><b>${esc(t('role_' + r))}</b><span>${esc(t('roleD_' + r))}</span></span></button>`).join('')}
    <button class="btn secondary block" type="button" id="resetDemo">${esc(t('reset'))}</button>`, s => {
    s.addEventListener('click', e => {
      const r = e.target.closest('.role-opt'); if (r) { setRole(r.dataset.role); s.remove(); setTab('me'); }
      if (e.target.closest('#resetDemo')) { const lang = S.lang; S = freshState(); S.lang = lang; persist(); s.remove(); renderChrome(); updatePins(); fitAll(); renderSheet(); if (tab === 'me') renderMe(); toast(t('resetDone')); }
    });
  });
};
$('#langBtn').onclick = () => { const from = S.lang; S.lang = S.lang === 'en' ? 'sw' : 'en'; track('locale.changed', { from, to: S.lang }); persist(); renderChrome(); renderSheet(); if (tab !== 'explore') setTab(tab); map.draw(); };
const themeObs = () => { map && map.draw(); renderSheet(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeObs);
new MutationObserver(themeObs).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const s = document.querySelector('.scrim'); if (s) s.remove(); else closeOverlay(); } });

renderChrome();
initExplore();
renderSheet();
track('page.view', { screen: 'explore' });
if (document.fonts) document.fonts.ready.then(() => map.draw());
</script>

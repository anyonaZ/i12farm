name: Nightly database backup and rollup

# Free Postgres plans keep few or no backups, so we take our own.
# Runs at 01:15 Nairobi (22:15 UTC):
#   1. rolls yesterday's raw events into events_daily (works without pg_cron) and
#      runs order upkeep: auto-complete, unpaid cancellation, featured expiry
#   2. dumps the public and auth schemas, encrypted before leaving the runner,
#      kept as a private workflow artifact for 30 days.
#
# Repository secrets needed:
#   DATABASE_URL        Direct (non-pooled) connection string with sslmode=require
#   BACKUP_PASSPHRASE   Long random passphrase; store it in your password manager
#
# Restore: gpg -d backup.sql.gz.gpg | gunzip | psql "$TARGET_DB_URL"
# The dump holds password hashes and phone numbers: never make it public.

on:
  schedule:
    - cron: '15 22 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Roll up yesterday's events and run order upkeep
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker run --rm -e DATABASE_URL postgres:17 psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c 'select public.rollup_events()' -c 'select public.run_maintenance()'
      - name: Dump, compress and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y%m%dT%H%MZ)
          # pg_dump must be at least the server's major version.
          docker run --rm -e DATABASE_URL postgres:17 \
            pg_dump "$DATABASE_URL" --no-owner --no-privileges --schema=public --schema=auth \
            | gzip -9 \
            | gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
                  --symmetric --cipher-algo AES256 -o "i12farm-$stamp.sql.gz.gpg"
          ls -lh i12farm-*.gpg
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: i12farm-*.sql.gz.gpg
          retention-days: 30
          if-no-files-found: error
